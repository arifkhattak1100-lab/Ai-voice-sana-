name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Environment Secrets
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SANA_AI_Voice.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SANA-AI-Voice-APK
          path: app/build/outputs/apk/debug/SANA_AI_Voice.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "SANA AI Voice Assistant APK (v1.0.0)"
          body: "Official Android APK release. Download `SANA_AI_Voice.apk` below and install it on your Android device."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/SANA_AI_Voice.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
